<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Campus GeoQuest — QR sheet</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #fff; color: #08080a; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { margin: 0 0 24px; font-size: 12px; color: #555; }
      main { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
      figure { margin: 0; border: 1px solid #ddd; border-radius: 12px; padding: 16px; text-align: center; break-inside: avoid; }
      img { width: 100%; max-width: 320px; height: auto; }
      figcaption { margin-top: 8px; font-size: 14px; font-weight: 600; }
      code { font-size: 10px; font-weight: 400; color: #666; }
      @media print {
        body { padding: 0; }
        main { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        figure { border: 1px solid #ccc; }
      }
    </style>
  </head>
  <body>
    <h1>Campus GeoQuest — Station QR codes</h1>
    <p>Print, cut out, and place each code at its station. Tokens must stay exactly as shown.</p>
    <main>
    <figure>
      <img src="./station-01.png" alt="Station 01 QR code" />
      <figcaption>Station 01<br /><code>GEOQUEST:ST-01</code></figcaption>
    </figure>
    <figure>
      <img src="./station-02.png" alt="Station 02 QR code" />
      <figcaption>Station 02<br /><code>GEOQUEST:ST-02</code></figcaption>
    </figure>
    <figure>
      <img src="./station-03.png" alt="Station 03 QR code" />
      <figcaption>Station 03<br /><code>GEOQUEST:ST-03</code></figcaption>
    </figure>
    <figure>
      <img src="./station-04.png" alt="Station 04 QR code" />
      <figcaption>Station 04<br /><code>GEOQUEST:ST-04</code></figcaption>
    </figure>
    <figure>
      <img src="./station-05.png" alt="Station 05 QR code" />
      <figcaption>Station 05<br /><code>GEOQUEST:ST-05</code></figcaption>
    </figure>
    <figure>
      <img src="./station-06.png" alt="Station 06 QR code" />
      <figcaption>Station 06<br /><code>GEOQUEST:ST-06</code></figcaption>
    </figure>
    <figure>
      <img src="./station-07.png" alt="Station 07 QR code" />
      <figcaption>Station 07<br /><code>GEOQUEST:ST-07</code></figcaption>
    </figure>
    <figure>
      <img src="./station-08.png" alt="Station 08 QR code" />
      <figcaption>Station 08<br /><code>GEOQUEST:ST-08</code></figcaption>
    </figure>
    <figure>
      <img src="./station-09.png" alt="Station 09 QR code" />
      <figcaption>Station 09<br /><code>GEOQUEST:ST-09</code></figcaption>
    </figure>
    <figure>
      <img src="./station-10.png" alt="Station 10 QR code" />
      <figcaption>Station 10<br /><code>GEOQUEST:ST-10</code></figcaption>
    </figure>
    </main>
  </body>
</html>
